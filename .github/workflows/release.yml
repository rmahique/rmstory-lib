# Triggered by pushing a version tag (this repo's tags have no "v"
# prefix, e.g. "1.0", not "v1.0"). Builds the same 5 packages
# build-packages.yml builds on every push (via that file's
# `workflow_call` trigger, so the matrix can't drift between the two),
# then attaches every .deb/.rpm/.sha512 to a GitHub Release for that tag
# -- a workflow-run artifact has no "latest" download URL and expires,
# so it can't be what README.md's Details > Distro packages section
# points users at.
#
# Filenames are prefixed with their combo name (e.g.
# opensuse-leap-16-python3-rmstory-...rpm) before upload: rpmbuild's
# %{?dist} tag is empty on openSUSE/SLES, so the Tumbleweed, Leap 16, and
# SLES 15 SP7 RPMs for the same version all build with identical
# filenames (verified locally -- Tumbleweed and Leap 16 both produced
# exactly `python3-rmstory-0.1.0^<date>-1.noarch.rpm`) and would
# silently overwrite each other once flattened into one release's asset
# list without this.
#
# After the release is published, `publish` also regenerates README.md's
# packages table (scripts/update-packages-table.py) from the exact assets
# just uploaded, and pushes that straight to main -- see the job's last
# two steps. Pushing a commit (not a tag) doesn't re-trigger this
# workflow or build-packages.yml (whose `paths:` filter doesn't include
# README.md), so there's no risk of a loop.

name: Release

on:
  push:
    # Every tag, no shape restriction: this repo doesn't use tags for
    # anything but releases, and GitHub Actions' tag-filter pattern
    # language mixes glob (`*` = any characters) with regex-style
    # quantifiers (`+` = one or more of the preceding character) in ways
    # that are easy to get subtly wrong without a fast feedback loop to
    # verify against (a `[0-9]+.[0-9]+*` pattern here previously matched
    # tag `1.0` but silently failed to match `1.0.1` -- no Release run
    # was even triggered). `tags: ["*"]` has no such ambiguity.
    tags:
      - "*"
  # Lets an existing tag get a Release retroactively without re-pushing
  # it -- pick the tag as the ref to run this workflow from (Actions tab
  # -> Release -> Run workflow -> Use workflow from: that tag).
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-packages.yml

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ref: main, not the tag this workflow triggered from (the default) --
      # the last two steps below push a commit, which needs a real branch
      # checked out, not the detached HEAD a tag checkout gives.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          pattern: rmstory-*
          path: dist-packages
      - name: Prefix each file with its combo name to guarantee unique filenames
        run: |
          mkdir -p release-assets
          for dir in dist-packages/rmstory-*/; do
            combo="$(basename "$dir")"
            combo="${combo#rmstory-}"
            for f in "$dir"*; do
              cp "$f" "release-assets/${combo}-$(basename "$f")"
            done
          done
          ls -la release-assets/
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
      - name: Regenerate README.md's packages table from the assets just published
        run: python3 scripts/update-packages-table.py release-assets "${{ github.ref_name }}" "${{ github.repository }}"
      - name: Commit and push the updated table, if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: update packages table for ${{ github.ref_name }}"
          git push origin HEAD:main
