# Builds website/ (MkDocs + Material, see website/mkdocs.yml) and deploys
# it to GitHub Pages on every push to main that touches the site's own
# content or a file it depends on. Requires a one-time repo setting:
# Settings -> Pages -> Source: "GitHub Actions" (not committed here --
# that setting lives in the repo, not in a file).
#
# multilang-lib isn't on PyPI, so it's checked out and installed the way
# its own documentation does (clone, then `pip install -e .` from its
# python/ directory) -- not via pip's own git-URL installer, which in
# testing produced an inconsistent build from the same commit.
#
# website/python.md's code block is copied verbatim from
# examples/basic_usage.py -- this workflow actually runs that script
# before building the site (see "Run the example" below), so a change
# that breaks the example fails the build instead of silently publishing
# stale or wrong documentation.

name: Deploy examples site

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "examples/**"
      - "rmstory/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: rmstory-lib
      - uses: actions/checkout@v7
        with:
          repository: rmahique/multilang-lib
          path: multilang-lib
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e multilang-lib/python
      - run: pip install -e rmstory-lib
      - run: pip install -r rmstory-lib/website/requirements.txt
      - name: Run the example (fails the build if website/python.md's source drifts from reality)
        run: PYTHONPATH=rmstory-lib python3 rmstory-lib/examples/basic_usage.py
      # -d (site_dir) resolves relative to the config file's own directory
      # (website/), not the shell's cwd -- same as docs_dir. An absolute
      # path sidesteps that ambiguity instead of relying on where mkdocs
      # happens to land it.
      - run: mkdocs build --strict -f rmstory-lib/website/mkdocs.yml -d "$GITHUB_WORKSPACE/site-build"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
