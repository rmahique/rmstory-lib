[project]
name = "rmstory"
version = "0.1.0"
description = "Translate and recombine stories authored as tagged spans in markdown/HTML files"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
gemini = ["google-genai"]
deepl = ["deepl"]
google-translate = ["google-cloud-translate"]

[project.scripts]
rmstory = "rmstory.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rmstory*"]

[tool.setuptools]
license-files = ["LICENSE"]
